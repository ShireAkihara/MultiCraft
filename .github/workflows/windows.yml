name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-tcl
            git
            zip
            wget

      - name: Build (library + MultiCraft)
        run: |
          cd ./Windows
          ./Start.sh
          cmake --build . -j4
          cd ..
          strip -s ./bin/multicraft.exe

      - name: Package
        run: |
          mkdir MultiCraft
          cp -r ./bin MultiCraft/
          for d in builtin client clientmods fonts games locale mods textures; do
            [ -d "./$d" ] && cp -r "./$d" MultiCraft/ || true
          done
          cp multicraft.conf.example MultiCraft/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-Windows
          path: MultiCraft/
